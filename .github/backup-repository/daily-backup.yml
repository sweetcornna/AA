name: Daily AA backup

on:
  schedule:
    - cron: '17 3 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aa-production-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Export encrypted backup through the restricted SSH key
        env:
          AA_BACKUP_HOST: ${{ vars.AA_BACKUP_HOST }}
          AA_BACKUP_SSH_KEY: ${{ secrets.AA_BACKUP_SSH_KEY }}
          AA_BACKUP_KNOWN_HOSTS: ${{ secrets.AA_BACKUP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$AA_BACKUP_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          test -n "$AA_BACKUP_SSH_KEY"
          test -n "$AA_BACKUP_KNOWN_HOSTS"
          key_file="$RUNNER_TEMP/aa-backup-key"
          host_file="$RUNNER_TEMP/aa-backup-known-hosts"
          printf '%s\n' "$AA_BACKUP_SSH_KEY" > "$key_file"
          printf '%s\n' "$AA_BACKUP_KNOWN_HOSTS" > "$host_file"
          unset AA_BACKUP_SSH_KEY AA_BACKUP_KNOWN_HOSTS
          export_dir="$RUNNER_TEMP/aa-export"
          mkdir -m 0700 "$export_dir"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          bundle="$export_dir/aa-production-$stamp.tar.gz"
          ssh -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$host_file" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            "root@$AA_BACKUP_HOST" backup > "$bundle"
          python3 scripts/verify-backup.py "$bundle"
          (cd "$export_dir" && sha256sum "$(basename "$bundle")" > "$(basename "$bundle").sha256")
          printf 'AA_BACKUP_NAME=aa-production-%s\n' "$stamp" >> "$GITHUB_ENV"
      - name: Keep the verified encrypted snapshot for 90 days
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.AA_BACKUP_NAME }}
          path: ${{ runner.temp }}/aa-export/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Write backup result
        run: |
          printf '### AA production backup\n\nDatabase, runtime configuration and source were encrypted on the server, verified, and saved for 90 days.\n' >> "$GITHUB_STEP_SUMMARY"
